<!doctype html>
<!--
  §§ HEADER_DOC
  philosophy-map.html: interactive map of a project's philosophy: its values,
  its priorities and where it stands on each.
  Part of the "philosophical-alignment" skill. Zero dependencies: one file,
  vanilla JavaScript, inline SVG and CSS. Works opened directly from disk.

  HOW DATA GETS IN
    1. scripts/render.py inlines the philosophy JSON into the JSON script
       block with id "philosophy-data" near the end of this file (and,
       optionally, a proposal into the block with id "proposal-data").
    2. Or open this template as is and use "Load another file" / paste.

  WHAT THE PAGE SHOWS (visually calm; the bottom line comes first)
    Without a proposal: the synthesis ("Bottom line"), hard limits, tensions,
    glossary, other terms, amendment history, in that order. Each tension shows
    its name, its visual, its one-line stance and firmness; everything else sits
    behind one "Details" disclosure. Value definitions stay visible next to the
    visual. With a proposal: the page becomes a proposal review first (title,
    overall verdict, BLUF, the decision needed, hard limits at risk, only the
    touched tensions with stance and proposal on the same visual, one reason
    each), and "Show the full philosophy" reveals everything else.

  DISPLAY LABELS (plain words on screen; the data field names never change)
    hard_limits      -> "Lines we never cross"
    tensions         -> "Priorities"
    stance           -> "Where we stand"; firmness "firm" -> "Firm position"
    flip_conditions  -> "Exceptions we'd accept"
    verdict flip_condition_met -> "Allowed exception"
    status agreed / consented  -> "agreed by everyone" / "agreed, with concerns noted"
    positions[].holder         -> a capitalised first name (maintainers[].name if given)
    IDs such as T01 stay visible, in a quieter style, because agents cite them.

  PHILOSOPHY JSON (schema "philosophical-alignment/0.x"; files labelled with the skill's
  earlier name, "architectural-philosophy/0.x", are read the same way), fields read here:
    project, version, schema, mission, status_note, maintainers[{handle, role}],
    synthesis{text, as_of_version}   (the bottom line; stale when as_of_version != version),
    strictness ("advisory" | {level, by_firmness{}, by_tension{}, note}),
    hard_limits[{id, text, source}],
    tensions[{id, rev, slug, kind, name, status, flip_conditions[], precedents[{title, note, link}],
              amendments[{rev, date, summary}], positions[{holder, position|weights|priority,
              endorsement, note}], stance{summary, firmness, ...}}],
    amendment_log[{version, date, summary}],
    values[{id, name, rev, definition, looks_like[], too_little, not_to_be_confused_with,
            in_own_words, examples{good, missing_or_faked}}]   (the values glossary),
    glossary_terms[]   (other terms the philosophy relies on; same entry shape, shown as "Other terms").
    Poles and triad values carry "ref" (a glossary id); network tensions carry "refs"
    (parallel to "values"). A value with no glossary entry shows "no definition yet".
    kind "polarity": poles[2]{value, good, overdone}; stance.position in [-1, 1]
                     (-1 = fully toward poles[0], +1 = fully toward poles[1]).
    kind "triad":    values[3]{value, good}; stance.weights {value: share}, sums to 1.
    kind "network":  values[] (strings or {value}); edges[{a, b, note}]; stance.priority[].
    Unknown kinds and unknown fields are shown as plain text, never dropped silently.

  PROPOSAL JSON (overlay; schema "philosophical-alignment-proposal/0.1", or the earlier
  "architectural-philosophy-proposal/0.1"):
    {
      "schema": "philosophical-alignment-proposal/0.1",
      "title": "Short noun phrase naming the proposal",
      "summary": "One or two sentences.",
      "bluf": "2-4 sentences: what is proposed, how it fits overall, the one decision needed.",
      "overall": "consistent" | "departs" | "needs_decision",   // optional; computed when missing
      "philosophy_version": "0.1.0",            // optional: version it was checked against
      "touched": [
        { "id": "T01",                          // tension ID
          "position": 0.6,                      // polarity: where the proposal sits, -1..1
          "weights": {"Correctness": 0.5, ...}, // triad: shares that sum to 1
          "priority": ["Compatibility", ...],   // network: optional implied ordering
          "note": "free text, any kind",
          "verdict": "consistent" | "departs" | "flip_condition_met",
          "flip_condition": "quoted flip condition, when verdict is flip_condition_met",
          "reason": "why this verdict" }
      ],
      "hard_limits_at_risk": [ {"id": "H1", "reason": "..."} ],   // or plain ["H1"]
      "decision_needed": "The one question the human must answer."
    }
    "overall" when missing is computed: needs_decision if a hard limit is at risk, a
    contested tension is touched, or strictness above advisory applies to a departure;
    otherwise departs if any touched tension departs; otherwise consistent.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Philosophy Map</title>
<style>
/* §§ TOKENS: one family, four sizes, one accent; verdict colours only on verdicts */
:root {
  --bg: #f7f6f2;
  --surface: #ffffff;
  --ink: #1d2127;
  --ink-2: #565c66;
  --line: #dfdcd4;
  --accent: #23569b;
  --ok: #2c6a45;
  --warn: #8a5800;
  --bad: #b02a22;
  --bad-bg: #fbeeec;
  --font: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", Ubuntu, "DM Sans", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --fs-s: 0.875rem; --fs-m: 1rem; --fs-l: 1.3rem; --fs-xl: clamp(1.9rem, 4vw, 2.6rem);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --surface: #1c1f24; --ink: #e9e7e2; --ink-2: #a9adb5; --line: #33373f;
    --accent: #8fb5ff; --ok: #7cc89a; --warn: #e6b85c; --bad: #ff8f85; --bad-bg: #2b1c1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --surface: #1c1f24; --ink: #e9e7e2; --ink-2: #a9adb5; --line: #33373f;
  --accent: #8fb5ff; --ok: #7cc89a; --warn: #e6b85c; --bad: #ff8f85; --bad-bg: #2b1c1b;
  color-scheme: dark;
}

/* §§ BASE */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); background: var(--bg); font: 400 var(--fs-m)/1.6 var(--font); overflow-x: hidden; font-variant-numeric: tabular-nums; }
::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
.wrap { max-width: 60rem; margin: 0 auto; padding: 2.5rem 1rem 5rem; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 600; text-wrap: balance; }
h1 { font-size: var(--fs-xl); letter-spacing: -0.015em; }
h2 { font-size: var(--fs-l); }
h3 { font-size: var(--fs-l); }
h4 { font-size: var(--fs-s); margin-top: 1.1rem; }
p { margin: 0.4rem 0; }
a { color: inherit; text-underline-offset: 3px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0.4rem 0.9rem; min-height: 2.5rem; }
button:hover { border-color: var(--ink-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--ink-2); }
.small { font-size: var(--fs-s); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
section { margin-top: 3.5rem; }
section > h2 + p { margin-top: 0.3rem; }
.err { color: var(--bad); font-weight: 600; }
.warnline { color: var(--warn); font-size: var(--fs-s); }

/* §§ HEADER */
.top { display: flex; gap: 1rem; align-items: flex-start; justify-content: space-between; }
.top > div { min-width: 0; }
.mission { font-size: var(--fs-l); color: var(--ink-2); max-width: 44rem; margin-top: 0.6rem; line-height: 1.45; }
.meta { color: var(--ink-2); font-size: var(--fs-s); margin-top: 0.8rem; }
.status { color: var(--ink-2); font-size: var(--fs-s); max-width: 44rem; }
#theme { border: 0; background: none; color: var(--ink-2); font-size: var(--fs-s); padding: 0.4rem 0.5rem; flex: none; }
#theme:hover { color: var(--ink); }

/* §§ BOTTOM_LINE */
.lead { font-size: var(--fs-l); line-height: 1.55; max-width: 44rem; margin-top: 0.6rem; }
.overall { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 600; margin-top: 1rem; }
.overall .vdot { width: 0.7rem; height: 0.7rem; }
.decision { margin-top: 1.8rem; border: 1.5px solid var(--bad); background: var(--bad-bg); border-radius: 10px; padding: 1.1rem 1.25rem; }
.decision h2 { font-size: var(--fs-s); color: var(--bad); }
.peer-label { font-weight: 500; color: var(--ink-2); }
.decision.calm { border-color: var(--line); background: transparent; }
.decision.calm h2 { color: var(--accent); }
.decision .q { font-size: var(--fs-l); font-weight: 600; margin: 0.3rem 0 0; line-height: 1.4; }

/* §§ HARD_LIMITS */
.limits { list-style: none; padding: 0; margin: 0.8rem 0 0; display: grid; gap: 0.6rem; max-width: 46rem; }
.limits li { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 0 0.6rem; }
.limits .lid { color: var(--ink-2); font-weight: 600; }
.limits .src { color: var(--ink-2); font-size: var(--fs-s); }
.limits li.at-risk .lid, .limits .why { color: var(--bad); }
.limits .why { font-size: var(--fs-s); }

/* §§ VERDICTS (the only coloured marks besides the accent) */
.verdict { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 600; font-size: var(--fs-s); white-space: nowrap; }
.vdot { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; background: currentColor; flex: none; }
.c-consistent { color: var(--ok); } .c-departs { color: var(--bad); } .c-flip { color: var(--warn); } .c-other { color: var(--ink-2); }
.c-needs_decision { color: var(--bad); }

/* §§ TENSIONS */
.t-head { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: baseline; justify-content: space-between; }
#q { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0.4rem 0.75rem; min-height: 2.5rem; width: min(100%, 16rem); }
.t { border-top: 1px solid var(--line); padding: 1.6rem 0 0.4rem; margin-top: 1.6rem; display: grid; gap: 1rem 2.5rem; scroll-margin-top: 1rem; min-width: 0; }
.t:first-of-type { margin-top: 1rem; }
@media (min-width: 52em) { .t { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); } .t > details { grid-column: 1 / -1; } }
.t-meta { color: var(--ink-2); font-size: var(--fs-s); margin-top: 0.3rem; }
.tid { opacity: 0.7; font-size: 0.8rem; }
.t-stance { margin-top: 0.7rem; max-width: 34rem; }
.t-reason { margin-top: 0.7rem; }
.t-reason .verdict { margin-right: 0.35rem; }
details.more > summary { cursor: pointer; color: var(--accent); font-size: var(--fs-s); font-weight: 600; width: max-content; padding: 0.3rem 0; list-style-position: inside; }
details.more[open] > summary { margin-bottom: 0.2rem; }
.more-body { display: grid; gap: 0 2.5rem; font-size: var(--fs-s); max-width: 52rem; }
@media (min-width: 52em) { .more-body { grid-template-columns: 1fr 1fr; } }
.more-body ul { margin: 0.3rem 0 0; padding-left: 1.1rem; }
.more-body li { margin: 0.25rem 0; }
.more-body h4:first-child { margin-top: 0.4rem; }

/* §§ VALUES_INLINE (the definition sits next to the value) */
.val { min-width: 0; }
.val .term { font-weight: 600; }
.def { color: var(--ink-2); font-size: var(--fs-s); margin: 0.1rem 0 0; line-height: 1.45; }
.def.none { color: var(--warn); }
.term { text-decoration: underline dotted; text-decoration-color: var(--ink-2); text-underline-offset: 4px; color: inherit; }
.term.undef { text-decoration-style: dashed; }
#tip { position: fixed; z-index: 50; display: none; max-width: min(22rem, calc(100vw - 16px)); background: var(--ink); color: var(--bg); padding: 0.55rem 0.7rem; border-radius: 8px; font-size: var(--fs-s); line-height: 1.45; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.2); }

/* §§ POLARITY */
.poles { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
.poles .val:last-child { text-align: right; }
.track { position: relative; height: 3.6rem; margin: 0.5rem 0.5rem 0; }
.track .line { position: absolute; left: 0; right: 0; top: 1.75rem; height: 2px; background: var(--line); }
.track .mid { position: absolute; left: 50%; top: 1.35rem; width: 1px; height: 0.85rem; background: var(--ink-2); opacity: 0.45; }
.mk { position: absolute; top: 1.8rem; transform: translate(-50%, -50%); }
.mk .dot { display: block; width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--bg); }
.mk .diamond { display: block; width: 0.85rem; height: 0.85rem; transform: rotate(45deg); background: var(--bg); border: 2px solid currentColor; }
.mk .peer { display: block; width: 0.55rem; height: 0.55rem; border-radius: 50%; border: 1.5px solid var(--ink-2); background: var(--bg); }
.mk-label { position: absolute; white-space: nowrap; font-size: 0.78rem; font-weight: 600; left: 50%; transform: translateX(-50%); }
.mk-label.above { bottom: 0.95rem; }
.mk-label.below { top: 0.95rem; }
.mk-label.below2 { top: 1.95rem; font-weight: 500; }
.track.has-peers { height: 4.8rem; }
.mk.edge-l .mk-label { left: -0.3rem; transform: none; }
.mk.edge-r .mk-label { left: auto; right: -0.3rem; transform: none; }
.mk.stance .mk-label { color: var(--accent); }
.arrow { position: absolute; top: 1.75rem; height: 0; border-top: 2px dashed currentColor; opacity: 0.7; }
.lean { color: var(--ink-2); font-size: var(--fs-s); margin-top: 0.2rem; }

/* §§ TRIAD_NETWORK */
.figure { width: 100%; max-width: 17rem; margin: 0 auto; display: block; overflow: visible; }
.figure text { font-family: var(--font); fill: var(--ink); }
.vlist { list-style: none; padding: 0; margin: 0.8rem 0 0; display: grid; gap: 0.55rem; }
.vlist .num { color: var(--ink-2); font-weight: 600; margin-right: 0.35rem; }
.vlist .share { color: var(--ink-2); font-weight: 400; margin-left: 0.35rem; }
.keyline { color: var(--ink-2); font-size: var(--fs-s); margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.2rem 1rem; }
.keyline span { display: inline-flex; align-items: center; gap: 0.35rem; }
.keyline i { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--accent); }
.keyline i.dia { border-radius: 1px; transform: rotate(45deg); background: none; border: 2px solid currentColor; }
.keyline i.peer { background: none; border: 1.5px solid var(--ink-2); }
table.wt { border-collapse: collapse; margin-top: 0.4rem; width: 100%; }
table.wt th, table.wt td { text-align: right; padding: 0.2rem 0.4rem; border-bottom: 1px solid var(--line); font-weight: 400; }
table.wt th { color: var(--ink-2); }
table.wt th:first-child, table.wt td:first-child { text-align: left; }
.table-scroll { overflow-x: auto; }

/* §§ GLOSSARY */
.gl-grid { display: grid; gap: 1.6rem 2.5rem; margin-top: 1.2rem; }
@media (min-width: 46em) { .gl-grid { grid-template-columns: 1fr 1fr; } }
.gl { scroll-margin-top: 1rem; min-width: 0; }
.gl h3 { font-size: var(--fs-m); }
.gl > p { margin-top: 0.25rem; }
.gl:target h3 { color: var(--accent); }
.gl details { margin-top: 0.3rem; font-size: var(--fs-s); }
.gl summary { cursor: pointer; color: var(--accent); font-weight: 600; width: max-content; max-width: 100%; }
.gl dl { margin: 0.3rem 0 0; }
.gl dt { font-weight: 600; margin-top: 0.6rem; }
.gl dd { margin: 0.1rem 0 0; }
.gl dd ul { margin: 0; padding-left: 1.1rem; }
.gl blockquote { margin: 0; font-style: italic; }

/* §§ LOG_FOOTER */
.log { list-style: none; padding: 0; margin: 0.8rem 0 0; display: grid; gap: 0.7rem; font-size: var(--fs-s); max-width: 46rem; }
.log .when { color: var(--ink-2); display: block; }
.full-toggle { margin-top: 3rem; font-weight: 600; }
.loader { margin-top: 3.5rem; font-size: var(--fs-s); }
.loader summary { cursor: pointer; color: var(--ink-2); width: max-content; }
.loader textarea { width: 100%; min-height: 7rem; margin-top: 0.5rem; font: 0.82rem/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 0.5rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.loader .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; align-items: center; }
footer { margin-top: 1.5rem; font-size: var(--fs-s); color: var(--ink-2); }
@media (prefers-reduced-motion: no-preference) { .wrap { animation: rise 0.5s var(--ease) both; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media print { #theme, .loader, .full-toggle, #q { display: none; } body { background: #fff; } #fullwrap[hidden] { display: block !important; } .t { break-inside: avoid; } }
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

<!-- §§ DATA_BLOCKS: render.py replaces the contents of these two blocks. -->
<script type="application/json" id="philosophy-data">null</script>
<script type="application/json" id="proposal-data">null</script>

<script>
/* §§ SCRIPT */
(function () {
  "use strict";
  var app = document.getElementById("app");
  var DATA = null, PROPOSAL = null, LOAD_ERROR = "";
  var state = { q: "", showFull: false };
  var IDP = ""; // id prefix: review cards get "r-" so ids stay unique when the full philosophy is also shown

  // §§ HELPERS
  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function arr(v) { return Array.isArray(v) ? v : (v == null ? [] : [v]); }
  function readBlock(id) {
    var el = document.getElementById(id);
    if (!el) return null;
    var t = (el.textContent || "").trim();
    if (!t || t === "null") return null;
    try { return JSON.parse(t); } catch (e) { LOAD_ERROR = "Could not parse the " + id + " block: " + e.message; return null; }
  }
  function valName(v) { return typeof v === "string" ? v : (v && (v.value || v.name || v.label)) || "?"; }
  function pct(x) { return Math.round(x * 100) + "%"; }
  function num(x) { return typeof x === "number" && isFinite(x); }
  function signed(x) { return (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(2); }
  function getWeights(stance, values) {
    var w = stance && stance.weights, out = [];
    values.forEach(function (v, i) {
      var n = valName(v), x = null;
      if (Array.isArray(w)) x = w[i];
      else if (w && typeof w === "object") x = w[n];
      out.push(num(x) ? x : null);
    });
    if (out.some(function (x) { return x === null; })) return null;
    var s = out.reduce(function (a, b) { return a + b; }, 0);
    if (!(s > 0)) return null;
    return out.map(function (x) { return x / s; });
  }
  function verdictKey(v) {
    var k = String(v || "").toLowerCase().replace(/[^a-z]/g, "");
    if (k.indexOf("consist") === 0) return "consistent";
    if (k.indexOf("depart") === 0) return "departs";
    if (k.indexOf("flip") === 0) return "flip";
    return k ? "other" : "";
  }
  var VERDICT_LABEL = { consistent: "Consistent", departs: "Departs", flip: "Allowed exception", other: "Unclassified" };
  function verdictTag(v) {
    var k = verdictKey(v);
    if (!k) return "";
    return '<span class="verdict c-' + k + '"><span class="vdot" aria-hidden="true"></span>' + esc(k === "other" ? v : VERDICT_LABEL[k]) + "</span>";
  }
  var FIRM_LABEL = { core: "Core position", firm: "Firm position", working: "Working position", exploratory: "Exploratory position", soft: "Soft position", provisional: "Provisional position", loose: "Loose position" };
  var STATUS_LABEL = { provisional: "not yet confirmed", agreed: "agreed by everyone", consented: "agreed, with concerns noted", rough: "decided over an objection", scoped: "differs by area", contested: "not agreed yet", superseded: "replaced", retired: "retired" };
  function statusLabel(s) { return STATUS_LABEL[String(s || "").toLowerCase()] || String(s || ""); }
  var ENDORSE_LABEL = { "endorse": "agrees", "consent": "has no objection", "consent with concern": "agrees, with a concern", "stand aside": "stands aside", "in the rough": "still objects; the objection was heard", "object": "objects" };
  function endorseLabel(e) { return ENDORSE_LABEL[String(e || "").toLowerCase().replace(/[_-]+/g, " ").trim()] || String(e || ""); }
  var STRICT_NOTE = { "advisory": "the AI assistant explains and proceeds", "flag-and-ask": "the AI assistant stops and asks first", "review-gate": "changes wait for written approval" };
  // Schema labels this page reads; "architectural-philosophy/" is the skill's earlier name.
  var SCHEMA_PREFIXES = ["philosophical-alignment/", "architectural-philosophy/"];
  function schemaKnown(s) { return !s || SCHEMA_PREFIXES.some(function (p) { return String(s).indexOf(p) === 0; }); }
  // People are shown by a capitalised first name: maintainers[].name when given, else the handle.
  function displayName(h, short) {
    var m = arr(DATA && DATA.maintainers).filter(function (x) { return x && typeof x === "object" && x.handle === h; })[0];
    if (m && m.name) return short ? String(m.name).trim().split(/\s+/)[0] : String(m.name);
    return String(h || "?").split(/[-_.\s]+/).filter(Boolean).map(function (p) { return p.charAt(0).toUpperCase() + p.slice(1); }).join(" ");
  }
  function lowerFirst(x) { return x.charAt(0).toLowerCase() + x.slice(1); }
  function list(items) { return "<ul>" + items.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>"; }

  // §§ GLOSSARY_HELPERS (every value shows its definition, keyed by ref)
  var GLOSS = {}, GLOSS_BY_NAME = {};
  function buildGloss() {
    GLOSS = {}; GLOSS_BY_NAME = {};
    arr(DATA && DATA.values).forEach(function (v) {
      if (!v || !v.id) return;
      GLOSS[v.id] = v;
      if (v.name) GLOSS_BY_NAME[String(v.name).toLowerCase()] = v;
    });
  }
  function gl(name, ref) { return (ref && GLOSS[ref]) || (name && GLOSS_BY_NAME[String(name).toLowerCase()]) || null; }

  // §§ PROPOSAL_INDEX

  // §§ OVERALL (given, or computed from the documented rules)

  // §§ RENDER_POLARITY

  // §§ RENDER_TRIAD
  var TV = [[160, 30], [28, 258.6], [292, 258.6]]; // top, bottom-left, bottom-right
  function bary(w) { return [w[0] * TV[0][0] + w[1] * TV[1][0] + w[2] * TV[2][0], w[0] * TV[0][1] + w[1] * TV[1][1] + w[2] * TV[2][1]]; }

    if (peers.length > 1) peers.forEach(function (o) {
      var q = bary(o.w);

  // §§ RENDER_NETWORK

  // §§ RENDER_DETAILS (everything beyond the default view, behind one disclosure)
  function renderUnknown(t) {

  function goodsHTML(t) {

  // §§ RENDER_CARD

      var more = glMore(v, true);
      h += '<article class="gl" id="v-' + esc(v.id) + '"><h3>' + esc(v.name || v.id) + "</h3>" + (v.definition ? "<p>" + esc(v.definition) + "</p>" : '<p class="def none">No definition yet.</p>') +
        "<details><summary>Examples and the maintainer's words</summary><dl>" + more + "</dl></details></article>";
    });
    return h + "</div></section>";
  }
  function termsHTML(d) {
    var terms = arr(d.glossary_terms).filter(function (g) { return g && (g.id || g.name); });
    if (!terms.length) return "";
    var h = '<section aria-labelledby="ot"><h2 id="ot">Other terms</h2><p class="muted small">Words the philosophy relies on that are not values, and what they mean here.</p><div class="gl-grid">';
    terms.forEach(function (g) {
      var more = glMore(g, false), gid = g.id || String(g.name).toLowerCase().replace(/[^a-z0-9]+/g, "-");
      h += '<article class="gl" id="g-' + esc(gid) + '"><h3>' + esc(g.name || g.id) + "</h3>" + (g.definition ? "<p>" + esc(g.definition) + "</p>" : '<p class="def none">No definition yet.</p>') +
        (more ? "<details><summary>More about this term</summary><dl>" + more + "</dl></details>" : "") + "</article>";
    });
    return h + "</div></section>";
  }
  // The detail list shared by values and other terms. Values always show the maintainer's-words line
  // and their revision; terms show only the fields they have.
  function glMore(v, isValue) {
    var more = "";
    if (arr(v.looks_like).length) more += "<dt>Looks like</dt><dd><ul>" + arr(v.looks_like).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></dd>";
    if (v.too_little) more += "<dt>Too little looks like</dt><dd>" + esc(v.too_little) + "</dd>";
    if (v.not_to_be_confused_with) more += "<dt>Not to be confused with</dt><dd>" + esc(v.not_to_be_confused_with) + "</dd>";
    if (isValue || v.in_own_words) more += "<dt>In the maintainer's own words</dt><dd>" + (v.in_own_words ? "<blockquote>" + esc(v.in_own_words) + "</blockquote>" : '<span class="def none">Not yet captured.</span>') + "</dd>";
    var ex = v.examples || {};
    if (arr(ex.good).length) more += "<dt>Done well</dt><dd>" + exList(ex.good) + "</dd>";
    if (arr(ex.missing_or_faked).length) more += "<dt>Missing or faked</dt><dd>" + exList(ex.missing_or_faked) + "</dd>";
    Object.keys(v).forEach(function (k) {
      if (["id", "name", "rev", "definition", "looks_like", "too_little", "not_to_be_confused_with", "in_own_words", "examples"].indexOf(k) < 0 && v[k] != null && v[k] !== "")
        more += "<dt>" + esc(k.replace(/_/g, " ")) + "</dt><dd>" + esc(typeof v[k] === "object" ? JSON.stringify(v[k]) : v[k]) + "</dd>";
    });
    if (isValue) more += "<dt>Revision</dt><dd>" + esc(v.id) + ", revision " + esc(v.rev != null ? v.rev : 1) + "</dd>";
    return more;
  }
  // Examples may be one string or a list of strings.
  function exList(x) { var a = arr(x).map(function (e) { return esc(typeof e === "string" ? e : JSON.stringify(e)); }); return a.length > 1 ? "<ul>" + a.map(function (e) { return "<li>" + e + "</li>"; }).join("") + "</ul>" : a[0] || ""; }
  function logHTML(d) {
    var tlog = [];
    arr(d.tensions).forEach(function (t) { arr(t.amendments).forEach(function (a) { tlog.push({ date: a.date, label: (t.name || t.id) + ", revision " + a.rev, summary: a.summary }); }); });
    arr(d.amendment_log).forEach(function (a) { tlog.push({ date: a.date, label: a.version ? "Version " + a.version : (a.id || ""), summary: a.summary }); });
    tlog.sort(function (a, b) { return String(b.date || "").localeCompare(String(a.date || "")); });
    if (!tlog.length) return "";
    return '<section aria-labelledby="al"><h2 id="al">Update history</h2><ol class="log">' + tlog.map(function (a) {
      return '<li><span class="when">' + esc(a.label) + (a.date ? ", " + esc(a.date) : "") + "</span>" + esc(a.summary || "") + "</li>";
    }).join("") + "</ol></section>";
  }
  function philosophyHTML(d) { return synthesisHTML(d) + limitsHTML(d, false) + tensionsHTML(d) + glossaryHTML(d) + termsHTML(d) + logHTML(d); }

  // §§ RENDER_REVIEW (a proposal turns the page into a review first)
  function reviewHTML(d) {
    var P = PROPOSAL, touched = touchedMap(), tensions = arr(d.tensions), ov = overallOf();
    var h = '<header class="top"><div><h1>' + esc(P.title || "Untitled proposal") + "</h1>";
    h += '<p class="meta">Proposal review against the ' + esc(d.project || "project") + " philosophy" + (d.version ? ", version " + esc(d.version) : "") + "</p></div>" + themeBtn() + "</header>";
    h += '<p class="overall c-' + OVERALL_CLASS[ov.key] + '"><span class="vdot" aria-hidden="true"></span>' + esc(OVERALL_LABEL[ov.key]) + (ov.computed ? ' <span class="muted small" style="font-weight:400">(worked out from the verdicts below)</span>' : "") + "</p>";
    h += '<p class="lead">' + esc(P.bluf || P.summary || "No bottom line written for this proposal yet.") + "</p>";
    if (P.decision_needed) h += '<div class="decision' + (ov.key === "needs_decision" ? "" : " calm") + '" role="note" aria-labelledby="dn"><h2 id="dn">Decision needed</h2><p class="q">' + esc(P.decision_needed) + "</p></div>";
    if (P.philosophy_version && d.version && P.philosophy_version !== d.version) h += '<p class="warnline" style="margin-top:1rem">Checked against version ' + esc(P.philosophy_version) + "; the philosophy is now version " + esc(d.version) + ".</p>";
    var unknown = arr(P.touched).filter(function (t) { return !tensions.some(function (x) { return x.id === t.id; }); });
    if (unknown.length) h += '<p class="err">This proposal names priorities the philosophy does not have: ' + unknown.map(function (t) { return esc(t.id); }).join(", ") + "</p>";
    h += limitsHTML(d, true);
    var shown = tensions.filter(function (t) { return touched[t.id]; });
    var counts = {}; shown.forEach(function (t) { var k = verdictKey(touched[t.id].verdict); counts[k] = (counts[k] || 0) + 1; });
    // bug 2: singular and plural phrases ("1 departs", "2 are consistent", "1 is an allowed exception")
    var PHRASE = { departs: ["departs", "depart"], flip: ["is an allowed exception", "are allowed exceptions"], consistent: ["is consistent", "are consistent"], other: ["is unclassified", "are unclassified"] };
    var tally = ["departs", "flip", "consistent", "other"].filter(function (k) { return counts[k]; }).map(function (k) { return counts[k] + " " + PHRASE[k][counts[k] === 1 ? 0 : 1]; }).join(", ");
    var rest = tensions.length - shown.length;
    h += '<section aria-labelledby="tt"><h2 id="tt">Priorities this change touches</h2><p class="muted small">' + esc(tally) + (tally ? "." : "") + (rest ? " " + rest + " other priorit" + (rest > 1 ? "ies are" : "y is") + " untouched." : "") + "</p>";
    IDP = "r-"; h += shown.map(function (t) { return renderCard(t, touched[t.id], true); }).join("") + "</section>"; IDP = "";
    if (P.bluf && P.summary) h += '<p class="muted small" style="margin-top:2rem">As submitted: ' + esc(P.summary) + "</p>";
    return h;
  }

  // §§ RENDER_PAGE
  function loaderHTML(open) {
    return '<details class="loader"' + (open ? " open" : "") + "><summary>" + (DATA ? "Load another file or a proposal" : "Open a philosophy file") + "</summary>" +
      '<p class="muted">Paste philosophy or proposal JSON (the comment at the top of this file shows both shapes), or choose a file.</p>' +
      '<textarea id="paste" spellcheck="false" aria-label="JSON to load"></textarea><div class="row"><button type="button" id="apply">Apply</button>' +
      '<label class="muted">or file: <input type="file" id="file" accept=".json,application/json"></label>' +
      (PROPOSAL ? '<button type="button" id="clearprop">Remove the proposal</button>' : "") + '<span id="loadmsg" class="err" role="alert"></span></div></details>';
  }
  function themeBtn() {
    var t = document.documentElement.getAttribute("data-theme") || "auto";
    return '<button type="button" id="theme" aria-label="Color theme: ' + t + ', click to change">' + (t === "auto" ? "Theme: auto" : t === "light" ? "Theme: light" : "Theme: dark") + "</button>";
  }
  function render() {
    buildGloss();
    if (!DATA) {
      app.innerHTML = '<header class="top"><div><h1>Philosophy map</h1><p class="mission">No philosophy is embedded in this page yet.</p></div>' + themeBtn() + "</header>" +
        (LOAD_ERROR ? '<p class="err">' + esc(LOAD_ERROR) + "</p>" : "") + loaderHTML(true);
      wire(); return;
    }
    var d = DATA, h = "";
    if (LOAD_ERROR) h += '<p class="err">' + esc(LOAD_ERROR) + "</p>";
    if (PROPOSAL) {
      h += reviewHTML(d);
      h += '<button type="button" class="full-toggle" id="full" aria-expanded="' + state.showFull + '" aria-controls="fullwrap">' + (state.showFull ? "Hide the full philosophy" : "Show the full philosophy") + "</button>";
      h += '<div id="fullwrap"' + (state.showFull ? "" : " hidden") + ">" + headerHTML(d).replace(/<button type="button" id="theme"[^]*?<\/button>/, "").replace('<header class="top">', '<header class="top" style="margin-top:3rem">') + philosophyHTML(d) + "</div>";
    } else h += headerHTML(d) + philosophyHTML(d);
    h += loaderHTML(false);
    h += "<footer>Made with the philosophical-alignment skill.</footer>";
    app.innerHTML = h;
    wire(); filter();
  }

  // §§ TOOLTIP (hover, focus or tap on a value name shows its definition)
  var tip = document.createElement("div");
  tip.id = "tip"; tip.setAttribute("role", "tooltip");
  document.body.appendChild(tip);
  function showTip(el) {
    var id = el.getAttribute("data-tip-id"), g = id && GLOSS[id];
    tip.innerHTML = g ? "<strong>" + esc(g.name || g.id) + "</strong><br>" + esc(g.definition || "No definition yet.") : esc(el.getAttribute("data-tip") || "");
    tip.style.display = "block";
    var r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    var left = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, window.innerWidth - tw - 8));
    var top = r.bottom + 8; if (top + th > window.innerHeight - 8) top = r.top - th - 8;
    tip.style.left = left + "px"; tip.style.top = Math.max(8, top) + "px";
  }
  function hideTip() { tip.style.display = "none"; }
  function tipTarget(e) { return e.target && e.target.closest ? e.target.closest("[data-tip-id],[data-tip]") : null; }
  document.addEventListener("mouseover", function (e) { var el = tipTarget(e); if (el) showTip(el); else hideTip(); });
  document.addEventListener("focusin", function (e) { var el = tipTarget(e); if (el) showTip(el); else hideTip(); });
  document.addEventListener("focusout", hideTip);
  window.addEventListener("scroll", hideTip, { passive: true });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hideTip(); });

  // §§ EVENTS
  function filter() {
    var q = state.q.trim().toLowerCase(), any = false;
    app.querySelectorAll("section .t[data-search]").forEach(function (a) {
      if (a.closest("#fullwrap") === null && PROPOSAL) return; // review cards are never filtered
      var ok = !q || a.getAttribute("data-search").indexOf(q) >= 0; a.hidden = !ok; if (ok) any = true;
    });
    var nm = document.getElementById("nomatch"); if (nm) nm.hidden = any;
  }
  function revealHash() {
    var id = decodeURIComponent(location.hash.slice(1)); if (!id) return;
    var el = document.getElementById(id); if (!el) return;
    var fw = document.getElementById("fullwrap");
    if (fw && fw.hidden && fw.contains(el)) { state.showFull = true; render(); el = document.getElementById(id); }
    var det = el.querySelector && el.querySelector("details"); if (det && el.classList.contains("gl")) det.open = true;
    el.scrollIntoView({ block: "start" });
  }
  window.addEventListener("hashchange", revealHash);
  function wire() {
    var q = document.getElementById("q");
    if (q) q.addEventListener("input", function () { state.q = q.value; filter(); });
    var full = document.getElementById("full");
    if (full) full.addEventListener("click", function () { state.showFull = !state.showFull; render(); var f = document.getElementById("full"); f.focus(); });
    document.getElementById("theme").addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme") || "auto";
      var next = cur === "auto" ? "light" : cur === "light" ? "dark" : "auto";
      if (next === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("phil-map-theme", next); } catch (e) {}
      render(); document.getElementById("theme").focus();
    });
    var apply = document.getElementById("apply");
    if (apply) apply.addEventListener("click", function () { loadText(document.getElementById("paste").value); });
    var file = document.getElementById("file");
    if (file) file.addEventListener("change", function () {
      var f = file.files && file.files[0]; if (!f) return;
      var rd = new FileReader(); rd.onload = function () { loadText(String(rd.result)); }; rd.readAsText(f);
    });
    var cp = document.getElementById("clearprop");
    if (cp) cp.addEventListener("click", function () { PROPOSAL = null; render(); });
  }
  function loadText(txt) {
    var msg = document.getElementById("loadmsg"), obj;
    try { obj = JSON.parse(txt); } catch (e) { msg.textContent = "Not valid JSON: " + e.message; return; }
    if (obj && Array.isArray(obj.tensions)) { DATA = obj; LOAD_ERROR = ""; }
    else if (obj && Array.isArray(obj.touched)) {
      if (!DATA) { msg.textContent = "That is a proposal; open a philosophy first."; return; }
      PROPOSAL = obj; state.showFull = false;
    } else { msg.textContent = "Not a philosophy (needs a tensions list) or a proposal (needs a touched list)."; return; }
    render(); window.scrollTo(0, 0);
  }
  window.addEventListener("beforeprint", function () { document.querySelectorAll("details").forEach(function (d) { d.open = true; }); });

  // §§ BOOT
  try { var th = localStorage.getItem("phil-map-theme"); if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th); } catch (e) {}
  DATA = readBlock("philosophy-data");
  PROPOSAL = readBlock("proposal-data");
  if (DATA && !Array.isArray(DATA.tensions)) { LOAD_ERROR = "The embedded philosophy has no tensions list."; DATA.tensions = []; }
  render();
  if (location.hash) revealHash();
})();
</script>
</body>
</html>
